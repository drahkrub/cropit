server.port=8080

# Allow uploads up to 200 MB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Maximum side of preview and cropped output PNGs, in pixels (must be positive).
# Override with the CROPIT_TARGET_LONG_SIDE environment variable.
cropit.render.target-long-side=${CROPIT_TARGET_LONG_SIDE:2048}

# Rasterisation resolution for the optional pdftoppm + mogrify conversion mode.
cropit.render.dpi=${CROPIT_RENDER_DPI:400}

# Number of concurrent pdftoppm worker processes used during final rendering.
# Each worker handles one batch of pages (BATCH_SIZE = 10) in parallel.
# Increase for machines with more CPU cores; decrease to reduce memory pressure.
cropit.render.worker-pool-size=8

# Logging
logging.level.com.cropit=DEBUG
