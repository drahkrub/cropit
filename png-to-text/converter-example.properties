# Kopieren nach converter.properties und an die eigene Umgebung anpassen.
# Ollama-Basis-URL ohne /api/chat oder /v1; Modell muss auf dem Server vorhanden sein.
png-text.ollama-url=http://ollama-rechner:11434
png-text.model=mein-vision-modell:latest
png-text.input-dir=/pfad/zu/pngs
png-text.output-dir=/pfad/zu/texten
png-text.extension=md
png-text.overwrite=false
# Optional: eigene UTF-8-Promptdatei, z.B. für reinen Text statt Markdown.
# png-text.prompt-file=./prompt.txt
# png-text.read-timeout=10m
# png-text.context-size=16384
# png-text.max-tokens=8192
