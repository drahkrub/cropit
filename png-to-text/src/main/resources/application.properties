spring.application.name=png-to-text
spring.main.web-application-type=none
spring.main.banner-mode=off

png-text.input-dir=${INPUT_DIR:}
png-text.output-dir=${OUTPUT_DIR:}
png-text.ollama-url=${OLLAMA_BASE_URL:http://localhost:11434}
png-text.model=${OLLAMA_MODEL:}
png-text.prompt=${CONVERSION_PROMPT:Transcribe the complete content of this document image into Markdown. Preserve the original language, headings, lists and tables. Do not summarize or invent content. Return only the transcription, without surrounding code fences or commentary.}
png-text.prompt-file=${PROMPT_FILE:}
png-text.extension=${OUTPUT_EXTENSION:md}
png-text.overwrite=${OVERWRITE:false}
png-text.connect-timeout=${CONNECT_TIMEOUT:10s}
png-text.read-timeout=${READ_TIMEOUT:10m}
png-text.context-size=${CONTEXT_SIZE:16384}
png-text.max-tokens=${MAX_TOKENS:8192}
